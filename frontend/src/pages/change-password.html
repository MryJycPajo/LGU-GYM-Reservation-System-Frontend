<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <meta
        name="theme-color"
        content="#087348"
    />

    <title>Change Password | LGU Gym</title>

    <link
        rel="stylesheet"
        href="../style.css"
    />

    <link
        rel="stylesheet"
        href="../css/login.css"
    />

    <style>
        .change-password-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .change-password-card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .change-password-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .change-password-header h1 {
            margin-bottom: 10px;
        }

        .change-password-header p {
            color: #666;
            margin: 0;
        }

        .change-password-form label {
            display: block;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .password-input-wrapper {
            position: relative;
            margin-top: 8px;
        }

        .password-input-wrapper input {
            width: 100%;
            padding: 13px 45px 13px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }

        .change-password-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #087348;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .change-password-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #087348;
            text-decoration: none;
        }
/* =====================================
   SUCCESS MODAL
===================================== */

.success-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.45);
    padding: 20px;
}

.success-modal.show {
    display: flex;
}

.success-modal-box {
    width: 100%;
    max-width: 400px;
    background: #fff;
    border-radius: 16px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
}

.success-icon {
    width: 55px;
    height: 55px;
    margin: 0 auto 15px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #087348;
    color: white;
    font-size: 30px;
    font-weight: bold;
}

.success-modal-box h2 {
    margin: 0 0 10px;
}

.success-modal-box p {
    color: #666;
    line-height: 1.5;
    margin-bottom: 20px;
}

.success-modal-box button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #087348;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
} 

    </style>
</head>

<body>

    <main class="change-password-page">

        <section class="change-password-card">

            <header class="change-password-header">

                <h1>Change Password</h1>

                <p>
                    Set a new password for your LGU Gym Reservation
                    System account.
                </p>

            </header>


            <form
                id="change-password-form"
                class="change-password-form"
            >

                <label>
                    New Password

                    <div class="password-input-wrapper">

                        <input
                            id="new-password"
                            type="password"
                            placeholder="Enter new password"
                            required
                        />

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="new-password"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </label>


                <label>
                    Confirm New Password

                    <div class="password-input-wrapper">

                        <input
                            id="confirm-new-password"
                            type="password"
                            placeholder="Confirm new password"
                            required
                        />

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirm-new-password"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </label>


                <button
                    id="change-password-btn"
                    class="change-password-button"
                    type="submit"
                >
                    Change Password
                </button>

            </form>


            <a
                class="back-login"
                href="../login.html"
            >
                Back to Login
            </a>

            <!-- SUCCESS MESSAGE MODAL -->

<div
    id="success-modal"
    class="success-modal"
>
    <div class="success-modal-box">

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Password Changed!
        </h2>

        <p id="success-message">
            Your password has been successfully changed.
        </p>

        <button
            id="success-ok-btn"
            type="button"
        >
            OK
        </button>

    </div>
</div>

        </section>

    </main>


    <script
        type="module"
        src="../js/client-change-password.js"
    ></script>

</body>

</html>
